name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r python/requirements.txt
          pip install pytest

      - name: Run classifier tests
        working-directory: python
        run: pytest -q test_classifier.py

      - name: Smoke-import server modules
        working-directory: python
        run: |
          python -c "import classifier, crawler, registry, generate_docs"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax-check MCP server
        run: node --check src/index.js

      - name: Syntax-check OpenAPI generator
        run: node --check scripts/gen-openapi.js

      - name: Verify the shipped DB matches every hash that claims to describe it
        # Three places assert this hash: the constant the runtime checks against,
        # SKILL.md (which agents read to pin a version), and the file itself. If
        # they drift, verifyDbOrThrow unlinks the bundled DB and the process
        # exits — so every `npx` start crashes, in production, for everyone.
        # Catch it here, where it costs a red build instead of an outage.
        run: |
          ACTUAL=$(shasum -a 256 data/registry.db | cut -d' ' -f1)
          CONST=$(grep -A1 'EXPECTED_DB_SHA256 =' src/index.js | grep -oE '[a-f0-9]{64}')
          SKILL=$(grep -oE '[a-f0-9]{64}' SKILL.md | head -1)
          echo "  db file:      $ACTUAL"
          echo "  src constant: $CONST"
          echo "  SKILL.md:     $SKILL"
          if [ "$ACTUAL" != "$CONST" ] || [ "$ACTUAL" != "$SKILL" ]; then
            echo "::error::registry.db hash disagrees with EXPECTED_DB_SHA256 and/or SKILL.md" >&2
            exit 1
          fi

      - name: Verify the SKILL.md install pin matches the package version
        # SKILL.md told agents to install 0.9.2 while main shipped 0.9.4, so an
        # agent following the documented command got different code than the
        # repo describes.
        run: |
          PKG=$(node -p "require('./package.json').version")
          PIN=$(grep -oE 'subgraph-registry-mcp@[0-9]+\.[0-9]+\.[0-9]+' SKILL.md | head -1 | sed 's/.*@//')
          echo "  package.json: $PKG / SKILL.md pin: $PIN"
          [ "$PKG" = "$PIN" ] || { echo "::error::SKILL.md pins $PIN but package.json is $PKG" >&2; exit 1; }

      - name: Verify the DB fallback download URL still resolves
        # ensureDb falls back to this URL when the bundled DB is missing. If it
        # 404s, the fallback path crashes instead of recovering.
        run: |
          URL=$(grep -A1 'GITHUB_DB_URL' src/index.js | grep -oE 'https://[^"]+')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-1023 "$URL")
          echo "  $URL -> $CODE"
          case "$CODE" in 200|206) ;; *) echo "::error::fallback DB URL returned $CODE" >&2; exit 1;; esac

      - name: Verify package.json and server.json versions match
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SRV_VERSION=$(node -p "require('./server.json').version")
          if [ "$PKG_VERSION" != "$SRV_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION server.json=$SRV_VERSION" >&2
            exit 1
          fi
          echo "Versions match: $PKG_VERSION"

      - name: OpenAPI spec drift check
        # Regenerate the spec from TOOLS[]/REST_ROUTES[] and fail the PR
        # if openapi.yaml is stale. update-registry.yml regenerates and
        # commits on every scheduled crawl, but this guards human edits
        # to src/index.js that would otherwise silently desync the spec
        # from the runtime.
        run: |
          node scripts/gen-openapi.js
          git diff --exit-code openapi.yaml data/openapi.json
