# Daily refresh of the x402-payments-to-The-Graph Dune dashboard.
#
# Dashboard: https://dune.com/paulieb/x402-payments-to-the-graph-e7ab
# Source data: USDC transfers on Base to The Graph's x402 gateway payTo
# (0x79DC34E41B2b591078d3dE222C43EcaaBD52FcCB).
#
# Each query is re-executed once a day so the dashboard reflects new
# payments without anyone touching it. Free tier on Dune doesn't
# auto-schedule queries; this workflow plays that role.
#
# Required repo secret: DUNE_API_KEY (set under Settings → Secrets and
# variables → Actions). Same key the dune CLI uses locally; create one
# at https://dune.com → APIs and Connectors → API Keys.
#
# Optional repo secret: GATEWAY_API_KEY — The Graph gateway API key used
# by refresh_known_agents.py to query the agent0-base-mainnet subgraph
# for operator-relationship matches (catches agents whose payer wallet
# isn't the registered owner). If missing, only 8004scan + operator seed
# + bazaar are used, which still covers owner-paid agents.
#
# Credit budget: 14 queries × 1 run/day × ~1 credit = ~14/day, ~420/month.
# Free tier ceiling is 2500/month so this is ~17% of quota.

name: refresh-x402-dune

on:
  schedule:
    # 13:00 UTC daily = 9am ET / 6am PT. Pre-coffee for any morning checks.
    - cron: '0 13 * * *'
  # Manual button under Actions tab; useful for ad-hoc refresh.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        # Needed so the known-agent refresh step can run scripts/refresh_known_agents.py.
        uses: actions/checkout@v4

      - name: Install Dune CLI
        run: |
          curl -sSfL https://dune.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sanity-check auth
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: dune whoami

      - name: Refresh known-agent directory (query 7507131)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          # Optional — enables agent0 subgraph fallback so operator-paid
          # agents (where payer wallet ≠ registered owner) are also matched.
          GRAPH_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
        run: |
          set -e
          # Discover every wallet that paid the gateway on Base, look each
          # up in 8004scan + agent0 subgraph, and rebuild the directory.
          # SQL lands at /tmp/known_agents_directory.sql; we PATCH it into
          # query 7507131 so the dashboard table fills in named matches.
          python3 scripts/refresh_known_agents.py
          dune query update 7507131 --sql "$(cat /tmp/known_agents_directory.sql)"

      - name: Re-execute all 14 dashboard queries (sequential)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        # Don't use `set -e` — we want to tally failures, not crash on the
        # first one. The Dune CLI sometimes returns plain-text errors that
        # jq can't parse; we handle that explicitly below.
        run: |
          QUERY_IDS=(
            7507068   # Lifetime totals
            7507075   # Trends — 24h/7d/30d
            7507076   # Daily volume + payments
            7507077   # Cumulative USDC
            7507078   # Top 25 payers
            7507079   # Payer concentration
            7507080   # New payers per day
            7507081   # Recent 50 payments
            7507082   # Activity — hour × day-of-week
            7507083   # Hours since last payment
            7507130   # Smart wallet vs EOA
            7507131   # Payer agent-vs-human classification (replaced payment-size 2026-05-19)
            7507132   # Inter-arrival rhythm
            7507133   # Active-days share
          )
          failures=0
          for qid in "${QUERY_IDS[@]}"; do
            echo "::group::Q$qid"
            # Sequential + wait avoids the rate-limiting we hit when these
            # ran in parallel during the initial build.
            if out=$(dune query run "$qid" -o json 2>&1); then
              # Tolerate non-JSON output: route jq's parse error to /dev/null
              # and fall back to literal strings so the script continues.
              state=$(echo "$out" | jq -r '.state // "no-state"' 2>/dev/null || echo "no-state")
              rows=$(echo "$out" | jq -r 'if (.result.rows? // null) != null then (.result.rows | length) else "?" end' 2>/dev/null || echo "?")
              if [ "$state" = "no-state" ]; then
                # CLI returned non-JSON — treat as a soft failure but keep going
                echo "Q$qid → non-JSON response (first 3 lines):"
                echo "$out" | head -3
                failures=$((failures+1))
              else
                echo "Q$qid → $state ($rows rows)"
              fi
            else
              echo "Q$qid → CLI exit non-zero:"
              echo "$out" | head -5
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          total=${#QUERY_IDS[@]}
          successes=$((total - failures))
          echo "✓ $successes / $total queries re-executed"
          if [ "$failures" -gt 0 ]; then
            # Soft warning — keep the run green. Dashboard reads cached results,
            # so a transient Dune outage doesn't break the UI; we just lose a
            # daily refresh and pick it up tomorrow.
            echo "::warning::$failures query/queries failed to refresh — dashboard still serves last good cache"
          fi
