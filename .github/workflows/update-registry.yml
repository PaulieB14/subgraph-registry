name: Update Subgraph Registry

on:
  schedule:
    - cron: "0 2 */3 * *"   # 02:00 UTC every 3rd day
  workflow_dispatch:
    inputs:
      mode:
        description: "Crawl mode"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full

# Serialize runs — two concurrent crawls race on python/data/sync-state.json
# and the second one's rebase hits a merge conflict, leaving git in detached
# HEAD and exit code 128. Queue instead.
concurrency:
  group: update-registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Crawl + classify + embed + ONNX fetch + openapi gen + docs fits
    # comfortably under 30min on a 2-core ubuntu-latest runner. A 45min
    # cap means a stuck HuggingFace download or hung gateway can't burn
    # GitHub's 6-hour default and block the concurrency:group queue.
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Cache fastembed model + transformers JS model
        # The embedder downloads ~50 MB on first use; cache against the
        # pip requirements hash so we only re-download when the deps
        # change. Both Python (~/.cache/fastembed) and the JS bundle
        # path (data/models) get cached so semantic search is fast
        # both at crawl time and runtime.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            data/models
          key: embedding-models-${{ hashFiles('python/requirements.txt') }}-v1

      - name: Run registry sync (${{ inputs.mode || 'incremental' }})
        working-directory: python
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "full" ]; then
            echo "Running full crawl..."
            python registry.py
          else
            echo "Running incremental sync..."
            python scheduler.py --once
          fi

      - name: Sync python DB to root (npm publish path)
        run: cp python/data/registry.db data/registry.db

      - name: Re-pin EXPECTED_DB_SHA256 and bump patch version
        # src/index.js verifyDbOrThrow() is interlocked with data/registry.db.
        # If the DB rebuilds but the constant doesn't, the next runtime
        # integrity check fails — this is the 0.6.0 outage. Re-pin and bump
        # in the same commit as the new DB so the repo never publishes an
        # inconsistent triple.
        run: |
          NEW_HASH=$(shasum -a 256 data/registry.db | awk '{print $1}')
          echo "new DB sha256: $NEW_HASH"
          # Node-based replace tolerates a multi-line declaration
          # (e.g. `const EXPECTED_DB_SHA256 =\n  "abc...";` after a prettier pass).
          # Previous sed approach was single-line-only and silently no-op'd.
          NEW_HASH="$NEW_HASH" node -e "
            const fs = require('fs');
            const want = process.env.NEW_HASH;
            const file = 'src/index.js';
            const src = fs.readFileSync(file, 'utf8');
            const re = /(const\s+EXPECTED_DB_SHA256\s*=\s*\")[a-f0-9]{64}(\")/;
            if (!re.test(src)) {
              console.error('::error::could not locate EXPECTED_DB_SHA256 literal in ' + file);
              process.exit(1);
            }
            fs.writeFileSync(file, src.replace(re, '\$1' + want + '\$2'));
            console.log('repinned EXPECTED_DB_SHA256 to', want);
          "
          grep -q "$NEW_HASH" src/index.js || {
            echo "::error::Failed to update EXPECTED_DB_SHA256 in src/index.js"
            exit 1
          }
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            const [maj,min,pat]=p.version.split('.').map(Number);
            const next=\`\${maj}.\${min}.\${pat+1}\`;
            p.version=next;
            fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
            // server.json mirrors the npm version in two places (the MCP
            // server schema requires both top-level and packages[0].version
            // to match the published npm tarball). The Test workflow's
            // 'Verify package.json and server.json versions match' step
            // hard-fails on drift, so bump both fields here in lockstep.
            const s=JSON.parse(fs.readFileSync('server.json','utf8'));
            s.version=next;
            if (Array.isArray(s.packages)) {
              for (const pkg of s.packages) if (pkg.version) pkg.version=next;
            }
            fs.writeFileSync('server.json', JSON.stringify(s,null,2)+'\n');
            console.log('bumped to', next);
          "

      - name: Install Node deps (for openapi gen + onnx fetch)
        run: npm install --no-audit --no-fund

      - name: Fetch ONNX embedding model (one-shot, cached)
        # @xenova/transformers ships the runtime that does cosine
        # similarity at MCP-tool-call time. The model itself isn't
        # in npm; we cache it here and bundle into the npm tarball
        # via package.json `files` so consumers run offline.
        run: node scripts/fetch-onnx-model.js

      - name: Regenerate OpenAPI spec
        # Source of truth for the spec is src/index.js TOOLS[] +
        # REST_ROUTES[]. Regenerate alongside the DB so the spec
        # always tracks the runtime — bundled in the npm tarball
        # and served at /.well-known/openapi.json.
        run: node scripts/gen-openapi.js

      - name: Generate charts and category docs
        run: python python/generate_docs.py

      - name: Commit updated registry, hash, version, and docs
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the four interlocked artifacts together — the repo is
          # never published in an inconsistent state.
          git add data/registry.db python/data/ docs/ src/index.js package.json server.json openapi.yaml data/openapi.json data/models/
          if git diff --cached --quiet; then
            echo "no-op (no DB/docs/hash changes); skipping commit + publish"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: update subgraph registry, hash, docs (${{ inputs.mode || 'incremental' }}) [skip ci]"
          # If main moved during the run, rebase. On conflict (typically
          # python/data/sync-state.json), abort cleanly — the next run will
          # re-derive the same artifacts. Don't leave detached HEAD.
          if ! git pull --rebase origin main; then
            echo "::warning::rebase failed (likely concurrent push); aborting and skipping publish"
            git rebase --abort || true
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "new_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        # Only runs when (a) the commit step actually pushed a new DB/hash/version
        # and (b) the NPM_TOKEN secret is configured in the repo.
        # If NPM_TOKEN is unset the step is skipped cleanly — manual publish remains
        # an option. To enable: add NPM_TOKEN repo secret in Settings → Secrets → Actions.
        if: steps.commit.outputs.committed == 'true' && env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NEW_VER="${{ steps.commit.outputs.new_version }}"
          echo "publishing subgraph-registry-mcp@${NEW_VER}"
          # `--access public` is required for first publish of a scoped package
          # and harmless for unscoped; safest to always pass.
          # `|| true` if the version already exists on registry (e.g. workflow
          # retried after a partial failure) — we don't want to fail the whole
          # workflow on a duplicate publish attempt.
          if npm view "subgraph-registry-mcp@${NEW_VER}" version >/dev/null 2>&1; then
            echo "version ${NEW_VER} already on registry; skipping publish"
            exit 0
          fi
          npm publish --access public

      - name: Publish to ClawHub
        # Pin to clawhub@0.23 (the current CLI line). The ClawHub *server*
        # rolls forward and eventually drops compatibility with old publish
        # payloads: the 7-week-old 0.17.0 CLI started getting rejected with
        # "API response: skillId: invalid value; versionId: invalid value"
        # (run 28845541838, 2026-07-07) even though auth still succeeded.
        # 0.23.x reads its token the same way (CLAWHUB_CONFIG_PATH honored).
        # If this recurs, bump the pin again toward the latest CLI.
        if: steps.commit.outputs.committed == 'true' && env.CLAWHUB_CONFIG_JSON != ''
        env:
          CLAWHUB_CONFIG_JSON: ${{ secrets.CLAWHUB_CONFIG_JSON }}
        run: |
          NEW_VER="${{ steps.commit.outputs.new_version }}"
          CFG="$RUNNER_TEMP/clawhub-config.json"
          printf '%s' "$CLAWHUB_CONFIG_JSON" > "$CFG"
          chmod 600 "$CFG"
          export CLAWHUB_CONFIG_PATH="$CFG"
          npx -y clawhub@0.23 whoami
          # Slug + path mirror Paul's manual flow: publish the repo root as
          # the `subgraph-registry` skill, version pinned to the bumped npm
          # version so the two registries stay in lockstep.
          # In 0.23 --no-input is a GLOBAL flag, so it goes before the subcommand.
          npx -y clawhub@0.23 --no-input skill publish . \
            --slug subgraph-registry \
            --version "$NEW_VER"
