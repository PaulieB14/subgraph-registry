name: Update Subgraph Registry

on:
  schedule:
    - cron: "0 2 */3 * *"   # 02:00 UTC every 3rd day
  workflow_dispatch:
    inputs:
      mode:
        description: "Crawl mode"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - full

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Run registry sync (${{ inputs.mode || 'incremental' }})
        working-directory: python
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "full" ]; then
            echo "Running full crawl..."
            python registry.py
          else
            echo "Running incremental sync..."
            python scheduler.py --once
          fi

      - name: Sync python DB to root (npm publish path)
        run: cp python/data/registry.db data/registry.db

      - name: Generate charts and category docs
        run: python python/generate_docs.py

      - name: Commit updated registry and docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/registry.db python/data/ docs/
          git diff --cached --quiet || git commit -m "data: update subgraph registry and docs (${{ inputs.mode || 'incremental' }}) [skip ci]"
          git pull --rebase origin main || true
          git push
