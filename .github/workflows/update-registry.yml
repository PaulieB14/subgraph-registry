name: Update Subgraph Registry

on:
  schedule:
    - cron: "0 2 */3 * *"   # 02:00 UTC every 3rd day
  workflow_dispatch:          # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r python/requirements.txt

      - name: Run incremental registry sync
        working-directory: python
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
        run: python scheduler.py --once

      - name: Generate charts and category docs
        run: python python/generate_docs.py

      - name: Commit updated registry and docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/registry.db python/data/ docs/
          git diff --cached --quiet || git commit -m "data: update subgraph registry and docs [skip ci]"
          git push
